<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Gradiente dello sfondo (dal turchese in basso a sinistra al viola in alto a destra) -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48F2DC" />
      <stop offset="35%" stop-color="#45C4F9" />
      <stop offset="70%" stop-color="#8589FF" />
      <stop offset="100%" stop-color="#AC6EFF" />
    </linearGradient>

    <!-- Maschera di ritaglio: il bianco mostra la coda, il nero la "fora" mostrando lo sfondo -->
    <mask id="cutoutMask">
      <rect width="1024" height="1024" fill="#FFFFFF" />

      <!-- Venature pinna superiore/sinistra (forate) -->
      <g fill="#000000" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
        <!-- Venatura lunga sinistra -->
        <path d="M 352 225 C 362 315, 428 385, 434 485 C 442 485, 436 385, 352 225 Z" stroke-width="6" />
        <!-- Venatura centrale -->
        <path d="M 430 290 C 455 370, 472 430, 468 492 C 478 430, 460 365, 430 290 Z" stroke-width="5" />
        <!-- Venatura corta destra -->
        <path d="M 504 340 C 508 390, 504 425, 498 456 C 510 425, 512 390, 504 340 Z" stroke-width="5" />

        <!-- Venature pinna destra (forate) -->
        <!-- Venatura superiore -->
        <path d="M 555 486 C 595 468, 635 460, 670 456 C 630 468, 595 476, 555 486 Z" stroke-width="5" />
        <!-- Venatura centrale -->
        <path d="M 522 520 C 590 496, 655 516, 730 520 C 655 524, 590 506, 522 520 Z" stroke-width="5" />
        <!-- Venatura inferiore -->
        <path d="M 538 550 C 625 530, 710 585, 810 580 C 710 595, 625 542, 538 550 Z" stroke-width="6" />
      </g>

      <!-- Squame lungo la coda (forate) -->
      <g fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <!-- Riga 1 (1 squama) -->
        <path d="M 385 568 C 408 542, 448 565, 432 598" />
        <!-- Riga 2 (2 squame) -->
        <path d="M 316 626 C 335 592, 382 605, 370 645 C 392 618, 435 638, 420 672" />
        <!-- Riga 3 (2 squame) -->
        <path d="M 270 704 C 290 668, 342 680, 336 722 C 358 690, 412 706, 408 746" />
        <!-- Riga 4 (3 squame) -->
        <path d="M 235 776 C 250 742, 298 750, 298 788 C 315 752, 362 760, 360 798 C 378 768, 425 782, 420 818" />
        <!-- Riga 5 (3 squame) -->
        <path d="M 215 862 C 228 825, 276 828, 280 865 C 296 828, 345 832, 348 868 C 365 835, 412 845, 415 880" />
        <!-- Riga 6 (3 squame) -->
        <path d="M 220 932 C 225 895, 272 895, 278 932 C 292 895, 338 895, 342 932 C 355 898, 402 902, 398 940" />
      </g>
    </mask>
  </defs>

  <!-- 1. Sfondo 1024x1024 con gradiente -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- 2. Coda della sirena bianca con intagli trasparenti sullo sfondo -->
  <path d="M 180 960 
           C 165 820, 195 700, 290 580 
           C 350 505, 375 455, 340 390 
           C 295 310, 270 250, 295 160 
           C 315 95, 355 55, 372 62 
           C 388 68, 370 110, 378 155 
           C 390 220, 460 250, 515 285 
           C 575 325, 580 375, 558 430 
           C 625 385, 695 400, 760 460 
           C 815 510, 885 520, 945 525 
           C 965 527, 955 545, 935 565 
           C 880 620, 830 665, 765 655 
           C 690 645, 625 600, 540 605 
           C 475 610, 445 645, 462 720 
           C 482 805, 480 885, 435 965 
           C 350 980, 260 975, 180 960 Z" fill="#FFFFFF" mask="url(#cutoutMask)" />
</svg>